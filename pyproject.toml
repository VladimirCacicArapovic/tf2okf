[build-system]
requires = ["setuptools>=78,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "tf2okf"
version = "0.5.0"
description = "Generate Open Knowledge Format (OKF) v0.2 bundles from Terraform-family repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "tf2okf contributors"}]
dependencies = ["PyYAML>=6.0.2,<7", "typer>=0.12.5,<1"]
keywords = ["terraform", "terragrunt", "tfscaffold", "okf", "open-knowledge-format", "copilot", "iac"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
hcl = ["python-hcl2>=7.0,<8"]
dev = [
  "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1", "mypy>=1.13,<2",
  "bandit>=1.8,<2", "pip-audit>=2.7,<3", "build>=1.2,<2", "twine>=6,<7",
  "types-PyYAML>=6.0,<7"
]

[project.scripts]
tf2okf = "tf2okf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["tf2okf"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
